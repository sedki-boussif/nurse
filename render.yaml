services:
  # Backend (Django)
  - type: web
    name: thesis-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: thesis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false

  # Database (PostgreSQL)
  - type: postgres
    name: thesis-db
    databaseName: thesis_database
    user: thesis_user
    plan: free
